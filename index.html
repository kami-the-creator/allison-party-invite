<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invitación Allison</title>
  <style>
    :root{
      --bg: #f9f3ef;   /* fondo igual a tu imagen */
      --card: rgba(255,255,255,.55);
      --stroke: rgba(0,0,0,.08);
      --txt: #2b2b2b;
      --muted: rgba(0,0,0,.6);
      --accent: #b01252;
    }
    *{ box-sizing:border-box; }

    <audio id="bgMusic" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" style="
  position:fixed;
  bottom:20px;
  right:20px;
  background:#b01252;
  color:white;
  border:none;
  padding:12px 16px;
  border-radius:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(176,18,82,.3);
">
  🔊 Música ON
</button>

<script>
  const music = document.getElementById("bgMusic");
  const btn = document.getElementById("musicBtn");

  btn.onclick = () => {
    if (music.paused) {
      music.play();
      btn.textContent = "🔊 Música ON";
    } else {
      music.pause();
      btn.textContent = "🔇 Música OFF";
    }
  };
</script>

    
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--txt);
    }
    .wrap{
      width:min(920px, 92vw);
      margin: 24px auto 60px;
      display:grid;
      gap:18px;
    }
    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 18px 70px rgba(0,0,0,.12);
    }
    .hero img{
      width:100%;
      height:auto;
      display:block;
      border-radius: 16px;
    }
    .title{
      margin: 4px 6px 0;
      font-weight: 800;
      letter-spacing:.02em;
      font-size: 18px;
    }
    .sub{
      margin: 0 6px 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .map{
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: #fff;
    }
    .map iframe{
      width:100%;
      height: 360px;
      border:0;
      display:block;
    }
    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top: 10px;
    }
    a.btn{
      text-decoration:none;
      color: white;
      background: var(--accent);
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 800;
      display:inline-flex;
      align-items:center;
      gap:10px;
      box-shadow: 0 14px 40px rgba(176,18,82,.18);
      transition: transform .12s ease, filter .12s ease;
    }
    a.btn:hover{ transform: translateY(-2px); filter: brightness(1.03); }
    a.btn.secondary{
      background: #111;
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
    }
    .mini{
      font-size: 12px;
      color: var(--muted);
      margin: 10px 6px 0;
    }
  </style>
</head>
<body>
  <main class="wrap">

    <!-- Imagen invitación -->
    <section class="card hero">
      <img src="INVITACION ALLISON 2.png" alt="Invitación Allison">
    </section>

    <!-- Mapa + Confirmación -->
    <section class="card">
      <div class="title">📍 Ubicación</div>
      <div class="sub">Abre el mapa y confirma por WhatsApp.</div>

      <div class="map">
        <!-- Pega aquí el src del iframe de Google Maps -->
       <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d943.5294025142655!2d-99.23948477442762!3d18.926187678071376!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cdde4c1f29d88d%3A0xdb97baf100930144!2sGral.%20Mariano%20Arista%2044%2C%20Cuernavaca%20Centro%2C%20Centro%2C%2062000%20Cuernavaca%2C%20Mor.!5e0!3m2!1ses!2smx!4v1769473089252!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <div class="btns">
        <!-- WhatsApp: cambia el número -->
        <a class="btn" target="_blank" rel="noopener"
           href="https://wa.me/527774664020?text=Hola%20😄%20Confirmo%20mi%20asistencia%20a%20los%2018%20de%20Allison%20✅">
          ✅ Confirmar por WhatsApp
        </a>

        <!-- Opcional: abrir Google Maps directo (si quieres, pega link normal aquí) -->
        <a class="btn secondary" target="_blank" rel="noopener"
           href="https://www.google.com/maps">
          🗺️ Abrir en Google Maps
        </a>
      </div>

      <div class="mini">
        Tip: si quieres que el botón “Abrir en Google Maps” lleve a tu dirección exacta, pega tu link de Maps ahí.
      </div>
    </section>

  </main>
</body>
</html>
